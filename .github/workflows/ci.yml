name: CI — Prompts & Agent Config

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  POSTGRES_USER: autoagent
  POSTGRES_PASSWORD: autoagent_test_pass
  POSTGRES_DB: autoagent_db
  POSTGRES_TEST_DB: autoagent_test
  GROQ_API_KEY: gsk_fake_for_ci
  GOOGLE_API_KEY: fake_for_ci
  OPENROUTER_API_KEY: fake_for_ci
  NEXTAUTH_SECRET: ci-test-secret-do-not-use-in-production
  LOG_LEVEL: WARNING

jobs:
  # ── Job 1: Prompt Structure Validation (fastest — no DB, no mocks) ──
  prompt-validation:
    name: "Prompt Structure Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run prompt + config tests
        run: |
          python -m pytest backend/tests/test_prompts.py backend/tests/test_config.py -v --tb=short

  # ── Job 2: Unit Tests (no DB, mocked LLM) ──
  unit-tests:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    needs: prompt-validation
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests (no DB)
        run: |
          python -m pytest \
            backend/test_fallback.py \
            backend/tests/test_agent_loop.py \
            backend/tests/test_safety.py \
            backend/tests/test_rate_limit.py \
            backend/tests/test_evaluation.py \
            backend/tests/test_auth.py \
            backend/tests/test_memory_store.py -k "not DB" \
            -v --tb=short -x

  # ── Job 3: DB Tests (requires PostgreSQL + pgvector) ──
  db-tests:
    name: "DB Tests"
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: autoagent
          POSTGRES_PASSWORD: autoagent_test_pass
          POSTGRES_DB: autoagent_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U autoagent; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Create pgvector extension
        run: |
          PGPASSWORD=autoagent_test_pass psql -h localhost -U autoagent -d autoagent_db -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run DB tests
        run: |
          python -m pytest \
            backend/tests/test_memory_store.py -k "DB" \
            backend/tests/test_evaluation.py -k "DB" \
            -v --tb=short -x

  # ── Job 4: CI Gate (all must pass before merge) ──
  ci-gate:
    name: "CI Gate"
    runs-on: ubuntu-latest
    needs: [prompt-validation, unit-tests, db-tests]
    steps:
      - run: echo "All checks passed. Ready to merge."

  # ── Job 5: Build Docker Image ──────────────────────────
  build-image:
    name: "Build Docker Image"
    runs-on: ubuntu-latest
    needs: ci-gate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/autoagent-backend"
          TAG="${{ github.sha }}"
          echo "tags=${IMAGE}:${TAG},${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 6: Deploy to Staging ────────────────────────────
  deploy-staging:
    name: "Deploy to Staging"
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/autoagent-staging

            # Update the image tag in .env
            sed -i "s|^DOCKER_IMAGE=.*|DOCKER_IMAGE=ghcr.io/${{ github.repository_owner }}/autoagent-backend:${{ github.sha }}|" .env.staging

            # Pull the new image
            docker compose -f docker-compose.staging.yml pull

            # Run database migrations
            docker compose -f docker-compose.staging.yml exec -T postgres \
              psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              < docker/migrate_add_prompt_versions.sql 2>/dev/null || true

            # Restart services
            docker compose -f docker-compose.staging.yml up -d

      - name: Smoke test staging
        run: |
          STAGING_URL="${{ vars.STAGING_URL }}"
          for i in $(seq 1 10); do
            if curl -sf "${STAGING_URL}/api/health" > /dev/null 2>&1; then
              echo "✅ Staging health check passed"
              exit 0
            fi
            echo "Waiting for staging... (attempt $i/10)"
            sleep 6
          done
          echo "❌ Staging health check failed"
          exit 1

  # ── Job 7: Deploy to Production ────────────────────────
  deploy-prod:
    name: "Deploy to Production"
    runs-on: ubuntu-latest
    needs: [build-image, deploy-staging]
    if: github.ref == 'refs/heads/main' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/autoagent

            # Update the image tag in .env
            sed -i "s|^DOCKER_IMAGE=.*|DOCKER_IMAGE=ghcr.io/${{ github.repository_owner }}/autoagent-backend:${{ github.sha }}|" .env

            # Pull the new image
            docker compose -f docker-compose.prod.yml pull

            # Restart services
            docker compose -f docker-compose.prod.yml up -d

      - name: Smoke test production
        run: |
          PROD_URL="${{ vars.PROD_URL }}"
          for i in $(seq 1 10); do
            if curl -sf "${PROD_URL}/api/health" > /dev/null 2>&1; then
              echo "✅ Production health check passed"
              exit 0
            fi
            echo "Waiting for production... (attempt $i/10)"
            sleep 6
          done
          echo "❌ Production health check failed"
          exit 1
