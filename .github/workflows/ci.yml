name: CI — Prompts & Agent Config

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  POSTGRES_USER: autoagent
  POSTGRES_PASSWORD: autoagent_test_pass
  POSTGRES_DB: autoagent_db
  POSTGRES_TEST_DB: autoagent_test
  GROQ_API_KEY: gsk_fake_for_ci
  GOOGLE_API_KEY: fake_for_ci
  OPENROUTER_API_KEY: fake_for_ci
  NEXTAUTH_SECRET: ci-test-secret-do-not-use-in-production
  LOG_LEVEL: WARNING

jobs:
  # ── Job 1: Prompt Structure Validation (fastest — no DB, no mocks) ──
  prompt-validation:
    name: "Prompt Structure Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Run prompt + config tests
        run: |
          python -m pytest backend/tests/test_prompts.py backend/tests/test_config.py -v --tb=short

  # ── Job 2: Unit Tests (no DB, mocked LLM) ──
  unit-tests:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    needs: prompt-validation
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Run unit tests (no DB)
        run: |
          python -m pytest \
            backend/test_fallback.py \
            backend/tests/test_agent_loop.py \
            backend/tests/test_safety.py \
            backend/tests/test_rate_limit.py \
            backend/tests/test_evaluation.py \
            backend/tests/test_auth.py \
            backend/tests/test_memory_store.py -k "not DB" \
            -v --tb=short -x

  # ── Job 2b: DB Tests (needs Postgres — was previously skipped entirely) ──
  db-tests:
    name: "DB Tests"
    runs-on: ubuntu-latest
    needs: prompt-validation
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: autoagent
          POSTGRES_PASSWORD: autoagent_test_pass
          POSTGRES_DB: autoagent_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoagent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Run DB tests
        run: |
          python -m pytest \
            backend/tests/test_memory_store.py \
            backend/tests/test_prompt_versioning.py \
            -v --tb=short

  # ── Job 3: CI Gate (all must pass before merge) ──
  ci-gate:
    name: "CI Gate"
    runs-on: ubuntu-latest
    needs: [prompt-validation, unit-tests, db-tests]
    steps:
      - run: echo "All checks passed. Ready to merge."

  # ── Job 4: Build Docker Image ──────────────────────────
  build-image:
    name: "Build Docker Image"
    runs-on: ubuntu-latest
    needs: ci-gate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/autoagent-backend"
          TAG="${{ github.sha }}"
          echo "tags=${IMAGE}:${TAG},${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
